# Configuracao do nginx que serve o build de producao do front-end.

server {
    # Porta 3000 para bater com o mapeamento "3000:3000" do docker-compose.
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressao: reduz bastante o tamanho do bundle JS/CSS na rede.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- Aplicacao (SPA) --------------------------------------------------
    # Como o React controla as rotas no navegador, qualquer caminho precisa
    # devolver o index.html. Sem isso, atualizar a pagina em uma rota interna
    # resultaria em 404 do proprio nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- API --------------------------------------------------------------
    # Repassa /api para o container do backend. O navegador enxerga tudo na
    # mesma origem (localhost:3000), entao nao ha problema de CORS.
    location /api/ {
        # O nome "backend" e resolvido a cada requisicao pelo DNS interno do
        # Docker, e nao so na inicializacao. Sem isso, se o container do
        # backend nao existir (ou cair e for recriado), o nginx nem sobe e o
        # site inteiro fica fora do ar, em vez de mostrar o aviso de erro.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        set $backend_api http://backend:5000;
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buscas por similaridade podem demorar; o timeout devolve 504 em vez
        # de deixar a requisicao pendurada indefinidamente.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Falhas do proxy viram JSON no formato que o front-end entende.
        error_page 502 503 @api_fora_do_ar;
        error_page 504 @api_tempo_esgotado;
    }

    location @api_fora_do_ar {
        default_type application/json;
        charset utf-8;
        return 503 '{"erro": "O serviço de consulta não está respondendo."}';
    }

    location @api_tempo_esgotado {
        default_type application/json;
        charset utf-8;
        return 504 '{"erro": "A consulta excedeu o tempo limite de 30 segundos."}';
    }
}
