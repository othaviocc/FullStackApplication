# Configuracao do nginx que serve o build de producao do front-end.

server {
    # Porta 3000 para bater com o mapeamento "3000:3000" do docker-compose.
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressao: reduz bastante o tamanho do bundle JS/CSS na rede.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- Aplicacao (SPA) --------------------------------------------------
    # Como o React controla as rotas no navegador, qualquer caminho precisa
    # devolver o index.html. Sem isso, atualizar a pagina em uma rota interna
    # resultaria em 404 do proprio nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- API --------------------------------------------------------------
    # Repassa /api para o container do backend. O navegador enxerga tudo na
    # mesma origem (localhost:3000), entao nao ha problema de CORS.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buscas por similaridade podem demorar; o timeout devolve 504 em vez
        # de deixar a requisicao pendurada indefinidamente.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ---- Erros ------------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
