services:
  db-server:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: db-server
    restart: always
    environment:
      POSTGRES_USER: admin_executivo
      POSTGRES_PASSWORD: senha_segura
      POSTGRES_DB: servidores_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    # So fica "healthy" quando o Postgres ja aceita conexoes; o backend e o
    # importador esperam por isso antes de subir.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_executivo -d servidores_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - rede_app

  # Popula o banco com os CSVs na primeira subida e encerra. Nas proximas,
  # ve que as tabelas ja tem dados e nao importa de novo.
  importador:
    build:
      context: .
      dockerfile: limpeza_dados/Dockerfile
    container_name: importador
    environment:
      - DB_HOST=db-server
      - DB_PORT=5432
      - DB_USER=admin_executivo
      - DB_PASS=senha_segura
      - DB_NAME=servidores_db
      - APOSENTADOS_CSV=/dados/APOSENTADOS_082026.csv
      - CARREIRA_CSV=/dados/CARREIRA-012017.csv
    depends_on:
      db-server:
        condition: service_healthy
    networks:
      - rede_app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-api
    restart: always
    environment:
      - DB_HOST=db-server
      - DB_PORT=5432
      - DB_USER=admin_executivo
      - DB_PASS=senha_segura
      - DB_NAME=servidores_db
    ports:
      - "5000:5000"
    depends_on:
      db-server:
        condition: service_healthy
    networks:
      - rede_app
    # O comando do Gunicorn será executado dentro do Dockerfile do backend,
    # garantindo o uso de Python + Flask + WSGI Gunicorn no contêiner.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-web
    restart: always
    ports:
      - "3000:3000" # Ajuste a porta externa dependendo do framework escolhido pela equipe 
    depends_on:
      - backend
    networks:
      - rede_app

volumes:
  db_data: # Volume persistente para não perder a importação dos dados do Portal Brasileiro de Dados Abertos se o contêiner for reiniciado[cite: 1].

networks:
  rede_app:
    driver: bridge